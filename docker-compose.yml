services:
  ytdl:
    build: .
    container_name: ytdl
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Téléchargements traités en parallèle.
      MAX_WORKERS: "2"
      # Durée de conservation d'un fichier terminé, en secondes (6 h) : laisse le
      # temps de récupérer un lot de vidéos depuis un autre appareil.
      FILE_TTL_SECONDS: "21600"
      # Nombre maximum de vidéos récupérées pour une playlist.
      MAX_PLAYLIST_ITEMS: "50"
      # "true" : tous les appareils voient la même liste de téléchargements et
      # peuvent récupérer les fichiers des autres (pratique en réseau local).
      # "false" : chaque navigateur ne voit que ses propres téléchargements.
      SHARE_JOBS: "${SHARE_JOBS:-false}"
      # Service de PO Tokens, requis quand YouTube réclame une vérification
      # (typiquement depuis une IP de datacenter). Aucun compte Google impliqué.
      POT_PROVIDER_URL: "${POT_PROVIDER_URL:-http://bgutil:4416}"
      # Vide en local ; "tv_simply" derrière une IP de datacenter, sans quoi le
      # client par défaut ignore les PO Tokens et YouTube réclame une connexion.
      PLAYER_CLIENTS: "${PLAYER_CLIENTS:-}"
      # Décommenter si les PO Tokens ne suffisent pas et qu'un compte est requis :
      # COOKIES_FILE: "/config/cookies.txt"
    volumes:
      - downloads:/data
      # - ./cookies.txt:/config/cookies.txt:ro
    tmpfs:
      - /tmp
    depends_on:
      - bgutil

  # Génère les PO Tokens réclamés par YouTube. Sans état, rien à persister.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: bgutil
    restart: unless-stopped
    init: true
    expose:
      - "4416"

volumes:
  downloads:
